<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" font-family="Arial, Helvetica, sans-serif">
<title>C-UAS Turret: PCB block diagram</title>
<desc>Wall adapter to barrel jack, fuse, reverse guard, TVS and bulk cap, then a 12 V rail feeding two motor kits and a buck module. The buck makes a 5 V rail for the Pi and the laser MOSFET. The Pi powers the camera and the Nucleo over USB. The Nucleo sends STEP, DIR and EN to the motor kits and one pin to the laser MOSFET.</desc>
